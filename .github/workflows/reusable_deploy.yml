# Called by dev.yml (dev branch) and prod.yml (main branch).
# PRs:   tests + typecheck + build only (no AWS access).
# Push:  tests, then deploy web (S3 + CloudFront) and API (ECR + Lambda).
# Config: .github/config/project.env (same pattern as the infrastructure repo).
# Auth:  GitHub OIDC -> [dev-]platform-admin-front-end-deploy-role (no AWS keys).
#        The role trusts the `environment:<env>` subject, so the deploy job
#        must keep `environment:` below.
name: Deploy Reusable

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: API tests
        working-directory: api
        run: |
          pip install -r requirements-dev.txt
          python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web typecheck + build
        working-directory: web
        env: # placeholders: this build is only a compile check
          VITE_API_URL: https://example.invalid
          VITE_COGNITO_AUTHORITY: https://example.invalid
          VITE_COGNITO_CLIENT_ID: placeholder
          VITE_COGNITO_DOMAIN: https://example.invalid
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load shared project config
        run: |
          grep -v '^#' .github/config/project.env \
            | grep -v '^[[:space:]]*$' \
            | sed -e $'s/\r$//' -e 's/="\(.*\)"$/=\1/' \
            >> "$GITHUB_ENV"

      - name: Select ${{ inputs.environment }} values
        # Maps e.g. WEB_BUCKET_DEV -> WEB_BUCKET. Fails before touching AWS
        # if a required value is missing for this environment.
        env:
          SUFFIX: ${{ inputs.environment == 'prod' && 'PROD' || 'DEV' }}
        run: |
          set -euo pipefail
          required="OIDC_ROLE_ARN CODEDEPLOY_APP ALERT_TOPIC_ARN WEB_BUCKET CLOUDFRONT_DISTRIBUTION_ID ECR_REPOSITORY LAMBDA_FUNCTION_NAME VITE_API_URL VITE_COGNITO_AUTHORITY VITE_COGNITO_CLIENT_ID VITE_COGNITO_DOMAIN"
          optional="VITE_PLATFORM_DOMAIN"
          missing=""
          for k in $required $optional; do
            src="${k}_${SUFFIX}"
            val="${!src:-}"
            if [ -z "$val" ] && [[ " $required " == *" $k "* ]]; then
              missing="$missing $src"
            fi
            [ "$k" = "VITE_API_URL" ] && val="${val%/}"
            echo "$k=$val" >> "$GITHUB_ENV"
          done
          if [ -n "$missing" ]; then
            echo "::error::.github/config/project.env is missing:$missing"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-sbs-admin-${{ inputs.environment }}-${{ github.run_id }}

      # ---------- web ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        env:
          VITE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          npm ci
          npm run build

      - name: Upload web (hashed assets immutable, index.html never cached)
        working-directory: web
        run: |
          aws s3 sync dist "s3://$WEB_BUCKET" --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$WEB_BUCKET/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/"

      # ---------- api ----------
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build + push API image (arm64)
        # Pushes :<sha> (traceability / rollback) AND :latest. The
        # infrastructure repo pins the function to "<repo>:latest", so the
        # function must point at :latest or the next infra apply would see
        # drift and switch it back to whatever :latest is (the placeholder).
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          REPO_URI="$REGISTRY/$ECR_REPOSITORY"
          # provenance=false: Lambda rejects OCI index manifests.
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false \
            --push -t "$REPO_URI:${{ github.sha }}" -t "$REPO_URI:latest" api
          echo "IMAGE=$REPO_URI:latest" >> "$GITHUB_ENV"

      - name: Release Lambda (blue/green)
        # Publishes the new image as a version and shifts the "live" alias to
        # it through CodeDeploy - prod: 10% for 5 minutes, rolled back
        # automatically if the function's alarms fire; dev: all at once. The
        # result (success / rolled back) is emailed via SNS either way.
        run: |
          bash .github/scripts/lambda-release.sh \
            --function "$LAMBDA_FUNCTION_NAME" \
            --image "$IMAGE" \
            --app "$CODEDEPLOY_APP" \
            --topic "$ALERT_TOPIC_ARN" \
            --environment "${{ inputs.environment }}" \
            --source "sbs-admin@${GITHUB_SHA::7}"
